<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    Alfa.

    The A of Alfa, and alpha: a line rising above a benchmark. The two strokes
    climb to a peak, and the pale crossbar is the benchmark they cross — the
    peer trend this app fits every chain against, and the thing a chain has to
    beat before any of its numbers mean anything. The crossbar overhangs the
    letter slightly, so it reads as an axis rather than only as a letterform.

    Hex is inlined because an SVG served as a favicon gets no page stylesheet.
    #0f1013 is the tile, #3987e5 the app's accent blue, #f4f5f7 the ink.
  -->
  <defs>
    <linearGradient id="alfa-a" x1="13.5" y1="12" x2="50.5" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9cc8ff" />
      <stop offset="1" stop-color="#2a6bd4" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="#0f1013" />
  <rect x="1" y="1" width="62" height="62" rx="14" fill="none" stroke="#2a2d34" stroke-width="1.5" />

  <!-- the climb -->
  <path d="M13.5 50.0 L32.0 15.0 L50.5 50.0" fill="none" stroke="url(#alfa-a)" stroke-width="7.6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- the benchmark it crosses -->
  <path d="M14.3 37.5 H49.7" stroke="#f4f5f7" stroke-width="4" stroke-linecap="round" />
</svg>
