<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    Cipher.

    The C of Cipher, closing on a single point: the one number this screen
    produces for every chain, the gap between what it earns and what it costs.
    The ticks along the inner edge are a scale — a reading, not a decoration.

    Hex is inlined because an SVG served as a favicon gets no page stylesheet.
    #0f1013 is the tile, #3987e5 the app's accent blue.
  -->
  <defs>
    <linearGradient id="cipher-c" x1="14" y1="12" x2="50" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9cc8ff" />
      <stop offset="1" stop-color="#2a6bd4" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="#0f1013" />
  <rect x="1" y="1" width="62" height="62" rx="14" fill="none" stroke="#2a2d34" stroke-width="1.5" />

  <!-- the jaw -->
  <path d="M44.63 20.62 A17.0 17.0 0 1 0 44.63 43.38" fill="none" stroke="url(#cipher-c)" stroke-width="8.6" stroke-linecap="round" />

  <!-- the vernier -->
  <path d="M23.94 23.94L26.34 26.34 M22.13 26.30L24.03 27.40 M20.99 29.05L24.27 29.93 M20.60 32.00L22.80 32.00 M20.99 34.95L24.27 34.07 M22.13 37.70L24.03 36.60 M23.94 40.06L26.34 37.66" stroke="#f4f5f7" stroke-width="1.3" stroke-linecap="round" opacity=".5" />

  <!-- the chain, held in the jaw -->
  <circle cx="48.00" cy="32" r="5" fill="#f4f5f7" />
</svg>
